<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>메모장</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap');

:root{
  --ink:#121212;
  --surface:#FFFFFF;
  --blue:#2E4BFF;
  --coral:#FF5D5D;
  --line:rgba(18,18,18,0.14);
  --field:rgba(18,18,18,0.045);
  --r-data:10px;
  --r-ui:14px;
  --r-lg:26px;
}
*{box-sizing:border-box; margin:0; padding:0;}
html,body{height:100%;}
body{
  min-height:100vh;
  background:var(--field);
  color:var(--ink);
  font-family:'IBM Plex Sans KR',sans-serif;
  display:flex;
  justify-content:center;
  align-items:flex-start;
  padding:clamp(0px,4vw,40px);
}
button, input, textarea, select{ font:inherit; color:inherit; }
button{ -webkit-tap-highlight-color:transparent; cursor:pointer; border:none; }
:focus-visible{ outline:2.5px solid var(--blue); outline-offset:2px; }
@media (prefers-reduced-motion:reduce){
  *{ transition:none !important; animation:none !important; }
}
@keyframes shake{
  10%,90%{ transform:translateX(-1px); }
  20%,80%{ transform:translateX(2px); }
  30%,50%,70%{ transform:translateX(-5px); }
  40%,60%{ transform:translateX(5px); }
}
.shake{ animation:shake 0.4s ease; }
.form-warning{
  min-height:16px;
  font-size:12.5px;
  font-weight:700;
  color:var(--coral);
  margin-bottom:4px;
  flex-shrink:0;
}
.auth-screen{
  position:fixed; inset:0;
  background:var(--field);
  display:flex; align-items:center; justify-content:center;
  padding:20px;
  z-index:200;
}
.auth-card{
  width:100%; max-width:360px;
  background:var(--surface);
  border-radius:var(--r-lg);
  padding:32px 26px;
  box-shadow:0 24px 60px rgba(18,18,18,0.15);
}
.auth-card h1{ text-align:center; margin-bottom:24px; }
.auth-card h2{ font-weight:700; font-size:19px; margin-bottom:8px; }
.auth-note{ font-size:13px; color:#5B5D63; margin-bottom:18px; line-height:1.5; }
.auth-card .btn{ width:100%; margin-top:6px; }
.user-bar{
  display:flex; align-items:center; justify-content:flex-end; gap:8px;
  padding:10px clamp(20px,4.5vw,36px) 0;
  font-size:12px; color:#5B5D63;
}
.user-bar button{
  font-size:12px;
  font-weight:700;
  border:none;
  border-radius:var(--r-ui);
  padding:6px 14px;
  background:var(--field);
  transition:background .15s ease, color .15s ease;
}
#btn-log{ color:var(--ink); }
#btn-log:hover{ background:var(--blue); color:#fff; }
#btn-logout{ color:var(--coral); }
#btn-logout:hover{ background:var(--coral); color:#fff; }
.log-list{ flex:1; overflow-y:auto; min-height:0; margin-bottom:12px; }
.log-row{ padding:10px 0; border-bottom:1px solid var(--line); font-size:13px; line-height:1.5; }
.log-row:last-child{ border-bottom:none; }
.log-time{ color:#5B5D63; font-size:11.5px; }
.log-action{ font-weight:700; }
.log-action.add{ color:var(--blue); }
.log-action.edit{ color:var(--blue); }
.log-action.delete{ color:var(--coral); }
#app-main{ display:none; }

.app{
  width:100%;
  max-width:620px;
  min-height:100vh;
  background:var(--surface);
  border-radius:var(--r-lg);
}

header{
  padding:clamp(24px,4.5vw,36px) clamp(20px,4.5vw,36px) 0;
}
h1{
  font-weight:700;
  font-size:clamp(30px,6vw,40px);
  letter-spacing:-0.02em;
  margin-bottom:18px;
}
.nav-switch{
  position:relative;
  display:inline-flex;
  background:var(--field);
  border-radius:999px;
  padding:4px;
}
.switch-knob{
  position:absolute;
  top:4px; bottom:4px; left:4px;
  background:var(--blue);
  border-radius:999px;
  z-index:0;
  transition:transform .28s cubic-bezier(.4,0,.2,1), width .28s cubic-bezier(.4,0,.2,1);
}
.tab{
  position:relative;
  z-index:1;
  border:none;
  background:none;
  padding:10px 22px;
  font-weight:700;
  font-size:14px;
  color:var(--ink);
  transition:color .28s ease;
}
.tab.active{ color:#fff; }

main{ padding:clamp(20px,4vw,30px) clamp(20px,4.5vw,36px) 64px; overflow-x:hidden; }
.view{ display:none; transition:transform .2s ease, opacity .2s ease; }
.view.active{ display:block; }
.offset-left{ transform:translateX(-32px); opacity:0; }
.offset-right{ transform:translateX(32px); opacity:0; }

.panel-tag{
  display:none;
  font-weight:700;
  font-size:12.5px;
  color:#fff;
  background:var(--ink);
  padding:4px 10px;
  border-radius:var(--r-ui);
  width:fit-content;
  margin-bottom:16px;
}

/* ---- memo list ---- */
.list-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:4px;
}
.list-count{ font-size:13px; font-weight:600; color:#5B5D63; }
.add-btn{
  width:40px; height:40px;
  border:none;
  border-radius:var(--r-ui);
  background:var(--blue);
  color:#fff;
  font-size:20px;
  font-weight:700;
  display:flex; align-items:center; justify-content:center;
  box-shadow:0 6px 16px rgba(46,75,255,0.4);
  transition:transform .15s ease, box-shadow .15s ease;
  flex-shrink:0;
}
.add-btn:active{ transform:scale(0.94); box-shadow:0 3px 8px rgba(46,75,255,0.35); }

.empty{ padding:64px 10px 30px; }
.empty p{ font-weight:700; font-size:15px; color:#5B5D63; }

.entry{
  display:flex;
  gap:14px;
  padding:20px 0;
}
.entry-badge{
  width:32px; height:32px;
  border-radius:var(--r-data);
  background:var(--ink);
  color:#fff;
  font-weight:700;
  font-size:12.5px;
  font-variant-numeric:tabular-nums;
  display:flex; align-items:center; justify-content:center;
  flex-shrink:0;
  margin-top:1px;
}
.entry-body{ flex:1; min-width:0; }
.entry-top{
  display:flex;
  align-items:baseline;
  gap:10px;
  flex-wrap:wrap;
}
.entry-date{
  font-size:13px;
  font-weight:600;
  color:#5B5D63;
  font-variant-numeric:tabular-nums;
}
.entry-title{ font-size:16.5px; font-weight:700; }
.entry-subject{
  font-size:11px;
  font-weight:700;
  color:var(--blue);
  background:rgba(46,75,255,0.1);
  padding:2px 9px;
  border-radius:var(--r-data);
}
.group-head{
  font-size:12.5px;
  font-weight:700;
  color:var(--blue);
  padding:16px 0 6px;
  border-bottom:1.5px solid rgba(46,75,255,0.2);
  margin-bottom:4px;
}
.group-head:first-child{ padding-top:0; }
.entry-image{
  display:block;
  max-width:100%;
  border-radius:var(--r-ui);
  margin-top:8px;
}
input[type=file]{
  width:100%;
  font-size:13px;
  padding:8px 0;
}
.entry-content{
  margin-top:6px;
  font-size:14.5px;
  font-weight:400;
  line-height:1.6;
  color:#33343A;
  white-space:pre-wrap;
  word-break:break-word;
}
.entry-actions{ display:flex; gap:8px; margin-top:11px; }
.entry-toggle, .entry-delete, .entry-edit{
  font-size:12px;
  font-weight:700;
  border:none;
  border-radius:var(--r-ui);
  padding:6px 14px;
  transition:transform .15s ease, background .15s ease, color .15s ease;
}
.entry-toggle{ background:var(--field); }
.entry-toggle:hover{ background:var(--coral); color:#fff; }
.entry-delete{ background:none; color:var(--coral); }
.entry-delete:hover{ background:var(--coral); color:#fff; }
.entry-edit{ background:none; color:var(--blue); }
.entry-edit:hover{ background:var(--blue); color:#fff; }
.entry-edit:active{ transform:scale(0.95); }
.entry-toggle:active, .entry-delete:active{ transform:scale(0.95); }

/* ---- calendar ---- */
.cal-nav{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:16px;
}
.cal-nav button{
  width:34px; height:34px;
  border:none;
  border-radius:var(--r-ui);
  background:var(--field);
  font-size:16px;
  font-weight:700;
  transition:transform .15s ease, background .15s ease;
}
.cal-nav button:active{ transform:scale(0.92); background:rgba(18,18,18,0.08); }
.cal-month{ font-weight:700; font-size:19px; }
.cal-grid{
  display:grid;
  grid-template-columns:repeat(7,1fr);
  gap:6px;
  transition:transform .2s ease, opacity .2s ease;
}
.cal-grid-wrap{ overflow-x:hidden; }
.cal-dow{
  font-size:clamp(11.5px,3vw,13px);
  font-weight:700;
  text-align:center;
  color:#5B5D63;
  padding:0 0 8px;
}
.cal-dow.weekend{ color:var(--coral); }
.cal-cell{
  min-height:clamp(58px,11vw,78px);
  background:var(--field);
  border-radius:var(--r-ui);
  padding:7px 5px;
  overflow:hidden;
}
.cal-cell.empty{ background:none; }
.cal-cell.has-notes{ cursor:pointer; transition:background .15s ease; }
.cal-cell.has-notes:hover{ background:rgba(18,18,18,0.09); }
.cal-daynum{
  display:inline-block;
  font-size:clamp(12px,3.2vw,13.5px);
  font-weight:600;
  color:#5B5D63;
  font-variant-numeric:tabular-nums;
}
.cal-cell.weekend .cal-daynum{ color:var(--coral); }
.cal-cell.today .cal-daynum{
  background:var(--blue);
  color:#fff;
  padding:1px 5px;
  border-radius:var(--r-data);
}
.cal-item{
  position:relative;
  display:block;
  margin-top:4px;
  font-size:clamp(10.5px,2.9vw,12px);
  font-weight:700;
  line-height:1.35;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.cal-item.dismissed{ color:#8A8C92; font-weight:500; }
.cal-item.dismissed::after{
  content:'';
  position:absolute; left:0; right:0; top:50%;
  height:2px;
  background:var(--coral);
}

/* ---- modal ---- */
.overlay{
  position:fixed; inset:0;
  background:rgba(18,18,18,0.55);
  display:none;
  align-items:stretch;
  justify-content:center;
  padding:16px;
  z-index:50;
}
.overlay.active{ display:flex; }
.sheet{
  background:var(--surface);
  width:100%;
  max-width:680px;
  border-radius:var(--r-lg);
  padding:28px 26px 24px;
  box-shadow:0 24px 60px rgba(18,18,18,0.28);
  display:flex;
  flex-direction:column;
  overflow-y:auto;
}
.sheet h2{ font-weight:700; font-size:19px; margin-bottom:20px; flex-shrink:0; }
.field{ margin-bottom:16px; flex-shrink:0; }
.field-grow{
  flex:1;
  display:flex;
  flex-direction:column;
  min-height:0;
  margin-bottom:16px;
}
.field-grow label{ flex-shrink:0; }
.field-grow textarea{ flex:1; min-height:0; resize:none; }
.field label{
  display:block;
  font-size:12.5px;
  font-weight:700;
  color:#5B5D63;
  margin-bottom:6px;
}
.date-title-row{ display:flex; gap:8px; }
.date-title-row .date-num{
  flex:0 0 58px;
  width:58px;
  text-align:center;
  font-size:13px;
  padding:11px 2px;
}
.date-num::-webkit-outer-spin-button, .date-num::-webkit-inner-spin-button{ -webkit-appearance:none; margin:0; }
.date-num{ -moz-appearance:textfield; }
.date-title-row input[type=text]{ flex:1 1 auto; width:auto; }
input[type=text], input[type=number], input[type=password], textarea, select{
  width:100%;
  border:none;
  background:var(--field);
  border-radius:var(--r-ui);
  padding:11px 13px;
  font-size:14px;
}
input[type=text]:focus, input[type=number]:focus, input[type=password]:focus, textarea:focus, select:focus{
  outline:none; background:var(--surface); box-shadow:0 0 0 3px rgba(46,75,255,0.3);
}
textarea{ resize:vertical; min-height:80px; }
.sheet-actions{ display:flex; gap:10px; margin-top:10px; }
.btn{
  flex:1;
  padding:13px;
  border:none;
  border-radius:var(--r-ui);
  font-size:14px;
  font-weight:700;
  transition:transform .15s ease;
}
.btn:active{ transform:scale(0.97); }
.btn-cancel{ background:var(--field); color:var(--ink); }
.btn-save{ background:var(--blue); color:#fff; box-shadow:0 6px 16px rgba(46,75,255,0.35); }

/* ---- responsive: wide / landscape ---- */
@media (min-width:700px){
  body{ align-items:center; }
  .app{
    min-height:auto;
    max-height:92vh;
    max-width:1060px;
    box-shadow:0 30px 70px -20px rgba(18,18,18,0.28);
    overflow:hidden;
  }
  header{ padding:34px 40px 0; }
  h1{ margin-bottom:0; }
  .nav-switch{ display:none; }
  main{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:0;
    padding:26px 0 0;
    max-height:calc(92vh - 96px);
  }
  .view{ display:flex !important; flex-direction:column; min-height:0; padding:0 40px 40px; }
  #view-memo{ padding-right:44px; }
  #view-calendar{ padding-left:44px; }
  .panel-tag{ display:block; }
  #memo-list{ overflow-y:auto; }
  .cal-grid-wrap{ overflow-y:auto; }
}
</style>
</head>
<body>
<div class="auth-screen" id="auth-login">
  <div class="auth-card">
    <h1>메모장</h1>
    <div class="form-warning" id="login-warning"></div>
    <div class="field">
      <label>번호</label>
      <input type="number" id="login-number" inputmode="numeric" placeholder="번호">
    </div>
    <div class="field">
      <label>비밀번호</label>
      <input type="password" id="login-password" placeholder="비밀번호">
    </div>
    <p class="auth-note">처음이면 초기 비밀번호 <strong>123abc</strong> 입력</p>
    <button class="btn btn-save" id="btn-login">로그인</button>
  </div>
</div>

<div class="auth-screen" id="auth-changepw" style="display:none;">
  <div class="auth-card">
    <h2>비밀번호 변경</h2>
    <p class="auth-note">초기 비밀번호입니다. 새 비밀번호로 바꿔주세요.</p>
    <div class="form-warning" id="changepw-warning"></div>
    <div class="field">
      <label>새 비밀번호</label>
      <input type="password" id="new-password" placeholder="새 비밀번호">
    </div>
    <div class="field">
      <label>새 비밀번호 확인</label>
      <input type="password" id="new-password-confirm" placeholder="새 비밀번호 확인">
    </div>
    <button class="btn btn-save" id="btn-changepw">변경</button>
  </div>
</div>

<div class="app" id="app-main">
  <header>
    <h1>메모장</h1>
    <div class="nav-switch" id="nav-switch">
      <div class="switch-knob" id="switch-knob"></div>
      <button class="tab active" data-tab="memo">메모장</button>
      <button class="tab" data-tab="calendar">캘린더</button>
    </div>
  </header>
  <div class="user-bar">
    <span id="user-label"></span>
    <button id="btn-log">기록</button>
    <button id="btn-logout">로그아웃</button>
  </div>

  <main>
    <section class="view active" id="view-memo">
      <div class="panel-tag">메모</div>
      <div class="list-head">
        <span class="list-count" id="list-count"></span>
        <button class="add-btn" id="fab-add" aria-label="메모 추가">+</button>
      </div>
      <div id="memo-list"></div>
    </section>

    <section class="view" id="view-calendar">
      <div class="panel-tag">캘린더</div>
      <div class="cal-nav">
        <button id="cal-prev" aria-label="이전 달">‹</button>
        <div class="cal-month" id="cal-month-label"></div>
        <button id="cal-next" aria-label="다음 달">›</button>
      </div>
      <div class="cal-grid-wrap">
        <div class="cal-grid" id="cal-grid"></div>
      </div>
    </section>
  </main>
</div>

<div class="overlay" id="overlay">
  <div class="sheet">
    <h2 id="modal-title">메모 추가</h2>
    <div class="field">
      <div class="date-title-row">
        <input type="number" id="input-month" class="date-num" inputmode="numeric" placeholder="월">
        <input type="number" id="input-day" class="date-num" inputmode="numeric" placeholder="일">
        <input type="text" id="input-title" placeholder="제목">
      </div>
    </div>
    <div class="field">
      <input type="text" id="input-subject" placeholder="과목">
    </div>
    <div class="field">
      <input type="file" id="input-image" accept="image/*">
      <div style="display:flex; align-items:center; gap:8px; margin-top:4px;">
        <p id="image-hint" style="font-size:11.5px;color:#5B5D63; flex:1; margin:0;"></p>
        <button type="button" id="btn-remove-image" style="display:none; font-size:11.5px; font-weight:700; color:var(--coral); background:none; border:none; padding:2px 6px;">이미지 삭제</button>
      </div>
    </div>
    <div class="field field-grow">
      <label>내용</label>
      <textarea id="input-content" placeholder="내용"></textarea>
    </div>
    <div class="form-warning" id="form-warning"></div>
    <div class="sheet-actions">
      <button class="btn btn-cancel" id="btn-cancel">취소</button>
      <button class="btn btn-save" id="btn-save">추가</button>
    </div>
  </div>
</div>

<div class="overlay" id="day-overlay">
  <div class="sheet" style="max-width:480px;">
    <h2 id="day-title"></h2>
    <div class="log-list" id="day-list"></div>
    <div class="sheet-actions">
      <button class="btn btn-cancel" id="btn-day-close">닫기</button>
    </div>
  </div>
</div>

<div class="overlay" id="log-overlay">
  <div class="sheet" style="max-width:480px;">
    <h2>활동 기록</h2>
    <div class="log-list" id="log-list"></div>
    <div class="sheet-actions">
      <button class="btn btn-cancel" id="btn-log-close">닫기</button>
    </div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";
import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-firestore.js";

// ▼▼▼ Firebase 콘솔 > 프로젝트 설정 > 웹 앱 에서 복사한 값으로 교체 ▼▼▼
const firebaseConfig = {
  apiKey: "AIzaSyBkdwJtFIaQ1STwjhyYHifFMNnVs7aLVX8",
  authDomain: "memo-app-3ce1f.firebaseapp.com",
  projectId: "memo-app-3ce1f",
  storageBucket: "memo-app-3ce1f.firebasestorage.app",
  messagingSenderId: "375882184011",
  appId: "1:375882184011:web:586d2c3e130af0e25b24ce"
};
// ▲▲▲ 여기까지 ▲▲▲

const firebaseApp = initializeApp(firebaseConfig);
const db = getFirestore(firebaseApp);
const notesRef = doc(db, "memo-app", "notes");
const accountsRef = doc(db, "memo-app", "accounts");
const logRef = doc(db, "memo-app", "activity-log");
const SESSION_KEY = "memo-app-session";
let currentUser = null;
let accounts = {};

async function hashPassword(pw){
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(pw));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}
function loadSession(){
  try{
    const raw = localStorage.getItem(SESSION_KEY);
    return raw ? JSON.parse(raw) : null;
  }catch(e){ return null; }
}
function saveSession(number){
  try{ localStorage.setItem(SESSION_KEY, JSON.stringify({ number })); }catch(e){}
}
function clearSession(){
  try{ localStorage.removeItem(SESSION_KEY); }catch(e){}
}
async function loadAccounts(){
  try{
    const snap = await getDoc(accountsRef);
    accounts = snap.exists() ? (snap.data().accounts || {}) : {};
  }catch(e){ accounts = {}; }
}
async function saveAccounts(){
  try{ await setDoc(accountsRef, { accounts }); }catch(e){}
}
async function logActivity(action, note){
  try{
    const snap = await getDoc(logRef);
    const entries = snap.exists() ? (snap.data().entries || []) : [];
    entries.push({
      action, number: currentUser.number,
      title: note.title, month: note.month, day: note.day,
      at: new Date().toISOString()
    });
    await setDoc(logRef, { entries });
  }catch(e){}
}
let notes = [];
let calMonth = new Date().getMonth() + 1;
let calYear = new Date().getFullYear();

const memoListEl = document.getElementById('memo-list');
const overlay = document.getElementById('overlay');
const monthSel = document.getElementById('input-month');
const daySel = document.getElementById('input-day');

monthSel.value = calMonth;
daySel.value = new Date().getDate();

function daysInMonth(m){
  return new Date(new Date().getFullYear(), m, 0).getDate();
}
function sanitizeMonth(){
  let v = parseInt(monthSel.value, 10);
  if(isNaN(v)) v = 1;
  if(v > 12) v = 12;
  if(v < 1) v = 1;
  monthSel.value = v;
}
function sanitizeDay(){
  let v = parseInt(daySel.value, 10);
  if(isNaN(v)) v = 1;
  const max = daysInMonth(parseInt(monthSel.value, 10) || 1);
  if(v > max) v = max;
  if(v < 1) v = 1;
  daySel.value = v;
}
monthSel.addEventListener('blur', ()=>{ sanitizeMonth(); sanitizeDay(); });
daySel.addEventListener('blur', sanitizeDay);

const navSwitch = document.getElementById('nav-switch');
const knob = document.getElementById('switch-knob');

function updateKnob(){
  const active = navSwitch.querySelector('.tab.active');
  if(!active) return;
  knob.style.width = active.offsetWidth + 'px';
  knob.style.transform = `translateX(${active.offsetLeft}px)`;
}

function isNarrow(){ return window.innerWidth < 700; }
function prefersReducedMotion(){ return window.matchMedia('(prefers-reduced-motion: reduce)').matches; }

function switchView(tab){
  const oldTab = navSwitch.querySelector('.tab.active');
  if(oldTab === tab) return;
  const forward = tab.dataset.tab === 'calendar';
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  tab.classList.add('active');
  updateKnob();

  const oldView = document.getElementById('view-'+oldTab.dataset.tab);
  const newView = document.getElementById('view-'+tab.dataset.tab);

  if(!isNarrow() || prefersReducedMotion()){
    oldView.classList.remove('active');
    newView.classList.add('active');
    if(tab.dataset.tab==='calendar') renderCalendar();
    return;
  }

  oldView.classList.add(forward ? 'offset-left' : 'offset-right');
  setTimeout(()=>{
    oldView.classList.remove('active','offset-left','offset-right');
    newView.classList.add(forward ? 'offset-right' : 'offset-left', 'active');
    if(tab.dataset.tab==='calendar') renderCalendar();
    void newView.offsetWidth;
    requestAnimationFrame(()=>{
      newView.classList.remove('offset-left','offset-right');
    });
  }, 200);
}

document.querySelectorAll('.tab').forEach(tab=>{
  tab.addEventListener('click', ()=> switchView(tab));
});
window.addEventListener('resize', updateKnob);
window.addEventListener('load', updateKnob);

const sheetEl = document.querySelector('.sheet');
const warningEl = document.getElementById('form-warning');

function shakeEl(el){
  el.classList.remove('shake');
  void el.offsetWidth;
  el.classList.add('shake');
}
function compressImage(file, maxDim=1000, quality=0.75){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = ()=>{
      const img = new Image();
      img.onload = ()=>{
        let { width, height } = img;
        if(width > height && width > maxDim){
          height = Math.round(height * maxDim/width); width = maxDim;
        } else if(height > maxDim){
          width = Math.round(width * maxDim/height); height = maxDim;
        }
        const canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        canvas.getContext('2d').drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = reject;
      img.src = reader.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}
function showFormWarning(msg){
  warningEl.textContent = msg;
  shakeEl(sheetEl);
}
function hideFormWarning(){
  warningEl.textContent = '';
}
sheetEl.addEventListener('animationend', ()=>{ sheetEl.classList.remove('shake'); });

let editingId = null;
let imageRemoved = false;

function openAddModal(){
  editingId = null;
  imageRemoved = false;
  document.getElementById('modal-title').textContent = '메모 추가';
  document.getElementById('btn-save').textContent = '추가';
  document.getElementById('input-title').value = '';
  document.getElementById('input-content').value = '';
  document.getElementById('input-subject').value = '';
  document.getElementById('input-image').value = '';
  document.getElementById('image-hint').textContent = '';
  document.getElementById('btn-remove-image').style.display = 'none';
  hideFormWarning();
  overlay.classList.add('active');
}
function openEditModal(note){
  editingId = note.id;
  imageRemoved = false;
  document.getElementById('modal-title').textContent = '메모 수정';
  document.getElementById('btn-save').textContent = '수정';
  monthSel.value = note.month;
  daySel.value = note.day;
  document.getElementById('input-title').value = note.title || '';
  document.getElementById('input-content').value = note.content || '';
  document.getElementById('input-subject').value = note.subject || '';
  document.getElementById('input-image').value = '';
  document.getElementById('image-hint').textContent = note.image ? '현재 이미지 있음 (새로 선택하면 교체됨)' : '';
  document.getElementById('btn-remove-image').style.display = note.image ? 'block' : 'none';
  hideFormWarning();
  overlay.classList.add('active');
}
document.getElementById('btn-remove-image').addEventListener('click', ()=>{
  imageRemoved = true;
  document.getElementById('input-image').value = '';
  document.getElementById('image-hint').textContent = '이미지가 삭제됩니다';
  document.getElementById('btn-remove-image').style.display = 'none';
});
document.getElementById('input-image').addEventListener('change', ()=>{
  if(document.getElementById('input-image').files[0]){
    imageRemoved = false;
    document.getElementById('image-hint').textContent = '';
    document.getElementById('btn-remove-image').style.display = 'none';
  }
});

document.getElementById('fab-add').addEventListener('click', openAddModal);
document.getElementById('btn-cancel').addEventListener('click', ()=>{
  editingId = null;
  hideFormWarning();
  overlay.classList.remove('active');
});
document.getElementById('btn-save').addEventListener('click', async ()=>{
  sanitizeMonth();
  sanitizeDay();
  const title = document.getElementById('input-title').value.trim();
  const content = document.getElementById('input-content').value.trim();
  const subject = document.getElementById('input-subject').value.trim();
  const month = parseInt(monthSel.value);
  const day = parseInt(daySel.value);
  if(!title || !content){
    let msg = '제목과 내용을 입력해주세요!';
    if(title && !content) msg = '내용을 적어주세요!';
    else if(!title && content) msg = '제목을 입력해주세요!';
    showFormWarning(msg);
    return;
  }
  hideFormWarning();
  const saveBtn = document.getElementById('btn-save');
  const busyLabel = editingId ? '처리 중…' : '처리 중…';
  const doneLabel = editingId ? '수정' : '추가';
  const imageFile = document.getElementById('input-image').files[0];
  let image = editingId ? (notes.find(n=>n.id===editingId)?.image ?? null) : null;
  if(imageFile){
    saveBtn.disabled = true;
    saveBtn.textContent = busyLabel;
    try{
      image = await compressImage(imageFile);
    }catch(e){
      showFormWarning('이미지를 처리하지 못했습니다!');
      saveBtn.disabled = false;
      saveBtn.textContent = doneLabel;
      return;
    }
    saveBtn.disabled = false;
    saveBtn.textContent = doneLabel;
  } else if(imageRemoved){
    image = null;
  }

  if(editingId){
    const note = notes.find(n=>n.id===editingId);
    Object.assign(note, { month, day, subject, title, content, image });
    await saveNotes();
    logActivity('edit', note);
  } else {
    const newNote = { id: Date.now(), month, day, subject, title, content, image, dismissed:false };
    notes.push(newNote);
    await saveNotes();
    logActivity('add', newNote);
  }
  editingId = null;
  document.getElementById('input-title').value='';
  document.getElementById('input-content').value='';
  document.getElementById('input-subject').value='';
  document.getElementById('input-image').value='';
  overlay.classList.remove('active');
  renderMemoList();
  renderCalendar();
});
overlay.addEventListener('click', (e)=>{ if(e.target===overlay){ editingId=null; overlay.classList.remove('active'); } });

let currentDayDetail = null;
function openDayDetail(month, day){
  currentDayDetail = { month, day };
  renderDayDetail();
  document.getElementById('day-overlay').classList.add('active');
}
function closeDayDetail(){
  currentDayDetail = null;
  document.getElementById('day-overlay').classList.remove('active');
}
function renderDayDetail(){
  if(!currentDayDetail) return;
  const { month, day } = currentDayDetail;
  const dayNotes = notes.filter(n=>n.month===month && n.day===day);
  document.getElementById('day-title').textContent = `${month}월 ${day}일`;
  const listEl = document.getElementById('day-list');
  if(dayNotes.length===0){
    listEl.innerHTML = '<p style="color:#5B5D63;font-size:13px;">메모가 없습니다.</p>';
    return;
  }
  listEl.innerHTML = dayNotes.map(n=>`
    <div class="entry" style="padding:14px 0;">
      <div class="entry-body" style="flex:1;">
        <div class="entry-top">
          ${n.subject?`<span class="entry-subject">${escapeHtml(n.subject)}</span>`:''}
          <span class="entry-title" style="${n.dismissed?'text-decoration:line-through;color:#8A8C92;':''}">${escapeHtml(n.title)}</span>
        </div>
        ${n.content?`<div class="entry-content">${escapeHtml(n.content)}</div>`:''}
        ${n.image?`<img class="entry-image" src="${n.image}" alt="">`:''}
      </div>
    </div>
  `).join('');
}
document.getElementById('btn-day-close').addEventListener('click', closeDayDetail);
document.getElementById('day-overlay').addEventListener('click', (e)=>{
  if(e.target.id==='day-overlay') closeDayDetail();
});

async function loadNotes(){
  memoListEl.innerHTML = '<div class="empty"><p>불러오는 중…</p></div>';
  try{
    const snap = await getDoc(notesRef);
    notes = snap.exists() ? (snap.data().items || []) : [];
  }catch(e){
    notes = [];
  }
  renderMemoList();
  renderCalendar();
  updateKnob();
}

async function saveNotes(){
  try{
    await setDoc(notesRef, { items: notes });
  }catch(e){}
}

function renderMemoList(){
  const visible = notes.filter(n=>!n.dismissed);
  document.getElementById('list-count').textContent = visible.length ? `${visible.length}개` : '';
  if(visible.length===0){
    memoListEl.innerHTML = '<div class="empty"><p>첫 메모를 추가하세요.</p></div>';
    return;
  }
  const groups = new Map();
  visible.forEach((n, i)=>{
    const key = n.subject && n.subject.trim() ? n.subject.trim() : '__ETC__';
    if(!groups.has(key)) groups.set(key, []);
    groups.get(key).push({ ...n, num: i+1 });
  });
  const keys = [...groups.keys()];
  const ordered = [...keys.filter(k=>k!=='__ETC__'), ...(keys.includes('__ETC__') ? ['__ETC__'] : [])];

  memoListEl.innerHTML = ordered.map(key=>{
    const label = key === '__ETC__' ? '기타' : key;
    return `
    <div class="group-head">${escapeHtml(label)}</div>
    ${groups.get(key).map(n=>`
    <div class="entry">
      <div class="entry-badge">${String(n.num).padStart(2,'0')}</div>
      <div class="entry-body">
        <div class="entry-top">
          <span class="entry-date">${String(n.month).padStart(2,'0')}.${String(n.day).padStart(2,'0')}</span>
          <span class="entry-title">${escapeHtml(n.title)}</span>
        </div>
        ${n.content?`<div class="entry-content">${escapeHtml(n.content)}</div>`:''}
        ${n.image?`<img class="entry-image" src="${n.image}" alt="">`:''}
        <div class="entry-actions">
          <button class="entry-toggle" data-id="${n.id}">해제</button>
          <button class="entry-edit" data-id="${n.id}">수정</button>
          <button class="entry-delete" data-id="${n.id}">삭제</button>
        </div>
      </div>
    </div>
  `).join('')}`;
  }).join('');
  memoListEl.querySelectorAll('.entry-toggle').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const id = Number(btn.dataset.id);
      const note = notes.find(n=>n.id===id);
      note.dismissed = true;
      await saveNotes();
      logActivity('dismiss', note);
      renderMemoList();
      renderCalendar();
    });
  });
  memoListEl.querySelectorAll('.entry-edit').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const note = notes.find(n=>n.id===Number(btn.dataset.id));
      openEditModal(note);
    });
  });
  memoListEl.querySelectorAll('.entry-delete').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const id = Number(btn.dataset.id);
      const note = notes.find(n=>n.id===id);
      if(!confirm('완전히 삭제할까요? 되돌릴 수 없습니다.')) return;
      notes = notes.filter(n=>n.id!==id);
      await saveNotes();
      if(note) logActivity('delete', note);
      renderMemoList();
      renderCalendar();
    });
  });
}

function escapeHtml(s){
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

function goToMonth(delta){
  const grid = document.getElementById('cal-grid');
  if(prefersReducedMotion()){
    calMonth += delta;
    if(calMonth<1){ calMonth=12; calYear--; }
    if(calMonth>12){ calMonth=1; calYear++; }
    renderCalendar();
    return;
  }
  const forward = delta > 0;
  grid.classList.add(forward ? 'offset-left' : 'offset-right');
  setTimeout(()=>{
    calMonth += delta;
    if(calMonth<1){ calMonth=12; calYear--; }
    if(calMonth>12){ calMonth=1; calYear++; }
    renderCalendar();
    grid.classList.remove('offset-left','offset-right');
    grid.classList.add(forward ? 'offset-right' : 'offset-left');
    void grid.offsetWidth;
    requestAnimationFrame(()=>{
      grid.classList.remove('offset-left','offset-right');
    });
  }, 200);
}
document.getElementById('cal-prev').addEventListener('click', ()=> goToMonth(-1));
document.getElementById('cal-next').addEventListener('click', ()=> goToMonth(1));

function renderCalendar(){
  document.getElementById('cal-month-label').textContent = calMonth + '월';
  const grid = document.getElementById('cal-grid');
  const firstDow = new Date(calYear, calMonth-1, 1).getDay();
  const daysInMonth = new Date(calYear, calMonth, 0).getDate();
  const today = new Date();
  const dowNames = ['일','월','화','수','목','금','토'];
  let html = dowNames.map((d,idx)=>`<div class="cal-dow ${(idx===0||idx===6)?'weekend':''}">${d}</div>`).join('');
  for(let i=0;i<firstDow;i++){ html += '<div class="cal-cell empty"></div>'; }
  for(let day=1; day<=daysInMonth; day++){
    const dayNotes = notes.filter(n=>n.month===calMonth && n.day===day);
    const dow = new Date(calYear, calMonth-1, day).getDay();
    const isToday = today.getFullYear()===calYear && today.getMonth()+1===calMonth && today.getDate()===day;
    const cls = ['cal-cell'];
    if(dow===0||dow===6) cls.push('weekend');
    if(isToday) cls.push('today');
    if(dayNotes.length>0) cls.push('has-notes');
    html += `<div class="${cls.join(' ')}" data-month="${calMonth}" data-day="${day}">
      <span class="cal-daynum">${day}</span>
      ${dayNotes.map(n=>`<div class="cal-item ${n.dismissed?'dismissed':''}">${escapeHtml(n.title)}</div>`).join('')}
    </div>`;
  }
  grid.innerHTML = html;
  grid.querySelectorAll('.cal-cell.has-notes').forEach(cell=>{
    cell.addEventListener('click', ()=>{
      openDayDetail(parseInt(cell.dataset.month), parseInt(cell.dataset.day));
    });
  });
}

function enterApp(){
  document.getElementById('auth-login').style.display = 'none';
  document.getElementById('auth-changepw').style.display = 'none';
  document.getElementById('app-main').style.display = 'block';
  document.getElementById('user-label').textContent = currentUser.number + '번';
  loadNotes();
}
function showChangePassword(){
  document.getElementById('auth-login').style.display = 'none';
  document.getElementById('auth-changepw').style.display = 'flex';
  document.getElementById('new-password').value = '';
  document.getElementById('new-password-confirm').value = '';
}

document.getElementById('btn-login').addEventListener('click', async ()=>{
  const numberEl = document.getElementById('login-number');
  const pwEl = document.getElementById('login-password');
  const warn = document.getElementById('login-warning');
  const card = document.querySelector('#auth-login .auth-card');
  const number = parseInt(numberEl.value, 10);
  const password = pwEl.value;

  if(isNaN(number) || !password){
    warn.textContent = '번호와 비밀번호를 입력해주세요!';
    shakeEl(card);
    return;
  }
  await loadAccounts();
  const key = String(number);
  const acc = accounts[key];
  const hashed = await hashPassword(password);

  if(!acc){
    if(password !== '123abc'){
      warn.textContent = '번호 또는 비밀번호가 틀렸습니다!';
      shakeEl(card);
      return;
    }
    accounts[key] = { password: await hashPassword('123abc'), mustChange: true };
    await saveAccounts();
  } else if(acc.password !== hashed){
    warn.textContent = '번호 또는 비밀번호가 틀렸습니다!';
    shakeEl(card);
    return;
  }

  warn.textContent = '';
  currentUser = { number };
  saveSession(number);
  pwEl.value = '';

  if(accounts[key].mustChange){
    showChangePassword();
  } else {
    enterApp();
  }
});

document.getElementById('btn-changepw').addEventListener('click', async ()=>{
  const p1 = document.getElementById('new-password').value;
  const p2 = document.getElementById('new-password-confirm').value;
  const warn = document.getElementById('changepw-warning');
  const card = document.querySelector('#auth-changepw .auth-card');

  if(!p1 || p1.length < 4){
    warn.textContent = '4자 이상 입력해주세요!';
    shakeEl(card);
    return;
  }
  if(p1 === '123abc'){
    warn.textContent = '초기 비밀번호는 다시 쓸 수 없습니다!';
    shakeEl(card);
    return;
  }
  if(p1 !== p2){
    warn.textContent = '비밀번호가 일치하지 않습니다!';
    shakeEl(card);
    return;
  }
  const key = String(currentUser.number);
  accounts[key] = { password: await hashPassword(p1), mustChange: false };
  await saveAccounts();
  warn.textContent = '';
  enterApp();
});

document.getElementById('btn-logout').addEventListener('click', ()=>{
  clearSession();
  location.reload();
});

document.getElementById('btn-log').addEventListener('click', async ()=>{
  const listEl = document.getElementById('log-list');
  listEl.innerHTML = '<p style="color:#5B5D63;font-size:13px;">불러오는 중…</p>';
  document.getElementById('log-overlay').classList.add('active');
  let entries = [];
  try{
    const snap = await getDoc(logRef);
    entries = snap.exists() ? (snap.data().entries || []) : [];
  }catch(e){}
  entries.sort((a,b)=> new Date(b.at) - new Date(a.at));
  if(entries.length===0){
    listEl.innerHTML = '<p style="color:#5B5D63;font-size:13px;">기록이 없습니다.</p>';
    return;
  }
  const actionLabel = { add:'추가', dismiss:'해제', delete:'삭제', edit:'수정' };
  listEl.innerHTML = entries.map(e=>{
    const d = new Date(e.at);
    const timeStr = `${d.getMonth()+1}.${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
    return `<div class="log-row">
      <span class="log-time">${timeStr}</span> ·
      <span class="log-action ${e.action}">${actionLabel[e.action]||e.action}</span> ·
      ${e.number}번 · ${escapeHtml(e.title||'')}
    </div>`;
  }).join('');
});
document.getElementById('btn-log-close').addEventListener('click', ()=>{
  document.getElementById('log-overlay').classList.remove('active');
});

(async function initAuth(){
  const session = loadSession();
  if(session && Number.isInteger(session.number)){
    await loadAccounts();
    const key = String(session.number);
    if(accounts[key]){
      currentUser = { number: session.number };
      if(accounts[key].mustChange){
        showChangePassword();
      } else {
        enterApp();
      }
    }
  }
})();
</script>
